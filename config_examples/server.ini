[common]
bind_addr = 0.0.0.0
bind_port = 7000
proxy_bind_addr = 0.0.0.0
kcp_bind_port = 7000
quic_bind_port = 7002

[auth]
method = token
token = your_token_here

[transport]
max_pool_count = 5
tcp_keep_alive = 7200
tcp_mux = true
tcp_mux_keepalive_interval = 30

[vhost]
http_port = 80
https_port = 443
tcpmux_httpconnect_port = 1337

[web_server]
address = 127.0.0.1
port = 7500
user = admin
password = admin

[log]
target = console
level = info
max_days = 3
