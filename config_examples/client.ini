[common]
server_addr = 127.0.0.1
server_port = 7000

[auth]
method = token
token = your_token_here

[transport]
protocol = tcp
pool_count = 1
heartbeat_interval = 30
heartbeat_timeout = 90

[web_host]
address = 127.0.0.1
port = 7400

[log]
target = console
level = info
max_days = 3

[ssh]
type = tcp
local_ip = 127.0.0.1
local_port = 22
remote_port = 6000

[dns]
type = udp
local_ip = 127.0.0.1
local_port = 53
remote_port = 6001

[web]
type = http
local_ip = 127.0.0.1
local_port = 80
custom_domains = www.example.com
subdomain = web
host_header_rewrite = 127.0.0.1

[secret-ssh]
type = stcp
local_ip = 127.0.0.1
local_port = 22
secret_key = abcdefg
allow_users = user1

[secret-ssh-visitor]
role = visitor
type = stcp
server_name = secret-ssh
secret_key = abcdefg
bind_addr = 127.0.0.1
bind_port = 6002
